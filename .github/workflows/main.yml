name: "Build Research Kernel"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Your kernel fork URL"
        required: true
        type: string
        default: "https://github.com/rorkx/kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "zepharo"
      kernelConfig:
        description: "Kernel configuration type"
        required: true
        type: choice
        options:
          - "bugbounty"
          - "standard"
          - "minimal"
      researchMode:
        description: "Enable research features"
        type: boolean
        default: true
      localVersion:
        description: "Custom localversion (e.g. -research)"
        required: false
        type: string
        default: "-research"

jobs:
  Build-Research-Kernel:
    name: "Build Research Kernel"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Setup build environment"
        run: |
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc python3 git zip
          sudo apt-get install -y gcc-aarch64-linux-gnu

          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=60" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "Clone research kernel"
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} kernel-source --depth=1
          cd kernel-source
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: "Configure research kernel"
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make ARCH=arm64 topaz_defconfig
          
          if [ "${{ github.event.inputs.researchMode }}" = "true" ]; then
            echo "Applying research configurations..."
            
            ./scripts/config --enable DEBUG_FS
            ./scripts/config --enable FTRACE
            ./scripts/config --enable FTRACE_SYSCALLS
            ./scripts/config --enable DEVMEM
            ./scripts/config --disable STRICT_DEVMEM
            ./scripts/config --enable KALLSYMS_ALL
            ./scripts/config --enable KPROBES
            ./scripts/config --enable UPROBES
            ./scripts/config --enable KGDB
            ./scripts/config --enable KGDB_SERIAL_CONSOLE
            ./scripts/config --enable KGDB_KDB
            ./scripts/config --enable PERF_EVENTS
            ./scripts/config --enable HW_PERF_EVENTS
            ./scripts/config --disable MODULE_SIG
            ./scripts/config --disable MODULE_SIG_FORCE
            ./scripts/config --enable BPF
            ./scripts/config --enable BPF_SYSCALL
            ./scripts/config --enable BPF_JIT
            ./scripts/config --enable PROC_PID_MEM
            ./scripts/config --enable PROC_KCORE
            ./scripts/config --enable KEXEC
            ./scripts/config --enable MAGIC_SYSRQ
            ./scripts/config --disable SECURITY_SELINUX_DEVELOP
            ./scripts/config --set-val SECURITY_SELINUX_CHECKREQPROT_VALUE 0
            ./scripts/config --enable DEBUG_INFO
            ./scripts/config --enable DEBUG_INFO_DWARF5
            ./scripts/config --enable DEBUG_KERNEL
            
            echo "Research configurations applied"
          fi
          
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> .config
          fi
          
          make ARCH=arm64 olddefconfig
          echo "Config verification:"
          grep -E "DEBUG_FS|FTRACE_SYSCALLS|DEVMEM|KPROBES|KGDB" .config | head -10

      - name: "Build research kernel"
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc --all)
          
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "Kernel compiled successfully!"
            ls -la arch/arm64/boot/Image.gz
          else
            echo "Kernel compilation failed!"
            exit 1
          fi

      - name: "Create research package"
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p anykernel_research/kernel
          cp arch/arm64/boot/Image.gz anykernel_research/kernel/
          
          # Используем heredoc с правильным экранированием
          cat > anykernel_research/anykernel.sh << 'ENDOFFILE'
#!/bin/bash

device_compatible="topaz tapas sapphire sapphiren";

ui_print "Installing Research Kernel...";
dd if=/tmp/anykernel/kernel/Image.gz of=/dev/block/bootdevice/by-name/boot;
ui_print "Research kernel installed successfully!";
ENDOFFILE

          chmod +x anykernel_research/anykernel.sh
          
          cd anykernel_research
          ZIP_NAME="ResearchKernel_${{ github.event.inputs.kernelConfig }}_${{ env.BUILD_TIME }}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..
          
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "Package created: $ZIP_NAME"

      - name: "Upload research artifact"
        uses: actions/upload-artifact@v4
        with:
          name: research-kernel
          path: ${{ env.KERNEL_DIR }}/ResearchKernel_*.zip
          retention-days: 30

      - name: "Build report"
        if: always()
        run: |
          echo "Research Kernel Build Report"
          echo "Build time: ${{ env.BUILD_TIME }}"
          echo "Configuration: ${{ github.event.inputs.kernelConfig }}"
          echo "Research mode: ${{ github.event.inputs.researchMode }}"
          
          if [ -f "${{ env.KERNEL_DIR }}/ResearchKernel_"*.zip ]; then
            echo "BUILD SUCCESSFUL"
          else
            echo "BUILD FAILED"
          fi
